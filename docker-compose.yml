version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: eduadapt-db
    restart: always
    environment:
      POSTGRES_DB: eduadapt
      POSTGRES_USER: eduadapt_user
      POSTGRES_PASSWORD: eduadapt_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduadapt_user -d eduadapt"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eduadapt-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://eduadapt_user:eduadapt_password@db:5432/eduadapt
      SECRET_KEY: eduadapt-production-hackathon-2026-secret-key
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eduadapt-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  pgdata:
